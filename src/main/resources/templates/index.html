<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>SendaLite - Rutas</title>
    <!-- CSRF token meta para logout via fetch -->
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
</head>
<body>
<nav>
    <a href="/">Rutas</a> |
    <span th:if="${currentUser != null and currentUser.admin}"><a href="/usuarios">Usuarios</a> |</span>
    <a href="/rutas/nueva">Crear Ruta</a> |
    <span th:if="${currentUser == null}">
        <a href="/login">Login</a> |
        <a href="/register">Registrarse</a>
    </span>
    <span th:if="${currentUser != null}">
        <span th:text="${currentUser.nombre}">Usuario</span> |
        <a href="#" id="logoutLink" onclick="logout();return false;" style="color:#00f;text-decoration:underline;">Logout</a>
        <span th:if="${currentUser.admin}"> | <a href="/admin">Admin</a></span>
    </span>
</nav>
<h1>Rutas disponibles</h1>
<div>
    <table border="1" cellpadding="6" cellspacing="0">
        <thead>
            <tr>
                <th>Título</th>
                <th>Descripción</th>
                <th>Actividad</th>
                <th>Dificultad</th>
                <th>Km</th>
                <th>Desnivel (m)</th>
                <th>Valoración media</th>
                <th>Ubicación</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="ruta : ${rutas}">
                <td><a th:href="@{'/rutas/' + ${ruta.idRuta}}" th:text="${ruta.titulo}">Ruta</a></td>
                <td th:text="${ruta.descripcion}">Descripción</td>
                <td th:text="${ruta.tipoActividad != null ? ruta.tipoActividad.name() : ''}">Actividad</td>
                <td th:text="${ruta.dificultad != null ? ruta.dificultad.name() : ''}">Dificultad</td>
                <td th:text="${ruta.distanciaKm != null ? #numbers.formatDecimal(ruta.distanciaKm,1,2) : ''}">0.0</td>
                <td th:text="${ruta.desnivelM != null ? ruta.desnivelM : ''}">0</td>
                <td th:text="${medias != null and medias.containsKey(ruta.idRuta) ? #numbers.formatDecimal(medias[ruta.idRuta],1,1) : '0.0'}">0.0</td>
                <td th:text="${ruta.ubicacion}">Ubicación</td>
            </tr>
        </tbody>
    </table>
</div>
<script th:inline="javascript">
    /*<![CDATA[*/
    function logout() {
        var meta = document.querySelector('meta[name="_csrf"]');
        var headerMeta = document.querySelector('meta[name="_csrf_header"]');
        var token = meta ? meta.getAttribute('content') : null;
        var headerName = headerMeta ? headerMeta.getAttribute('content') : 'X-XSRF-TOKEN';
        var headers = {};
        if (token) headers[headerName] = token;
        fetch('/logout', { method: 'POST', credentials: 'include', headers: headers })
            .then(r => { window.location = '/'; })
            .catch(e => { alert('Error al hacer logout: ' + e); });
    }
    /*]]>*/
</script>
</body>
</html>
